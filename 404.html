<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found // Bari Abder</title>
  <meta name="description" content="This page doesn't exist. Return to Bari Abder's main page.">
  <link rel="icon" type="image/png" href="fav-icon.png">

  <!-- Typography: Inter & IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="fav-icon.png">

  <link rel="stylesheet" href="style.css">

  <script>
    (function () {
      const saved = localStorage.getItem('theme-override');
      const hour = new Date().getHours();
      const isNight = hour >= 19 || hour < 7;
      const theme = saved || (isNight ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    /* ==========================================================================
       404 PAGE SPECIFIC MINIMAL STYLES
       ========================================================================== */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary, #ffffff);
      color: var(--text-primary, #111111);
      font-family: var(--font-inter, 'Inter', -apple-system, sans-serif);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .error-header {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary, #111111);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted, #666666);
    }

    /* Centered Error Container */
    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .error-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card, #f5f5f7);
      border: 1px solid var(--border-light, rgba(0, 0, 0, 0.08));
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted, #666666);
    }

    .error-tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-brand, #B6F44C);
    }

    .error-number {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--text-primary, #111111);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .error-number span.accent-digit {
      color: #9cdb34;
      text-shadow: 0 0 20px rgba(182, 244, 76, 0.35);
    }

    .error-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--text-primary, #111111);
      margin: 0;
    }

    .error-desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-muted, #666666);
      margin: 0;
      max-width: 400px;
    }

    .error-desc-ar {
      font-family: var(--font-sans, 'IBM Plex Sans Arabic', sans-serif);
      font-size: 14.5px;
      color: var(--text-dim, #8e8e93);
      margin-top: 4px;
      direction: rtl;
    }

    .error-action-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent-brand, #B6F44C);
      color: #000000 !important;
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      border: 1px solid #9ed43b;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(182, 244, 76, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-main:hover {
      background: #a8ed3a;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(182, 244, 76, 0.35);
    }

    .btn-main:active {
      transform: translateY(0);
    }

    .btn-main svg {
      transition: transform 0.2s ease;
    }

    .btn-main:hover svg {
      transform: translateX(3px);
    }

    /* Minimal Footer */
    .error-footer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted, #666666);
      border-top: 1px solid var(--border-light, rgba(0, 0, 0, 0.08));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .footer-links a:hover {
      color: var(--text-primary, #111111);
    }

    @media (max-width: 600px) {
      .error-number {
        font-size: 76px;
      }
      .error-title {
        font-size: 21px;
      }
      .error-header, .error-footer {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar: Logo & Theme Switcher -->
  <header class="error-header">
    <a href="https://www.bariabder.com" class="brand-logo" aria-label="Bari Abder Home">
      <span>Bari Abder</span>
      <span class="brand-sub">// Content Strategist</span>
    </a>

    <!-- Theme Toggle Pill -->
    <div class="theme-toggle-wrapper" style="padding-top: 0; width: auto;">
      <button
        type="button"
        id="themeToggle"
        class="theme-pill"
        aria-label="Toggle Light and Dark Mode"
        dir="ltr"
      >
        <span class="theme-thumb" aria-hidden="true"></span>
        <span class="theme-icon sun-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </span>
        <span class="theme-icon moon-icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Center 404 Hero -->
  <main class="error-main">
    <div class="error-card">
      <div class="error-tag">
        <span class="error-tag-dot"></span>
        <span>404 Error</span>
      </div>

      <h1 class="error-number" aria-label="Error 404">
        4<span class="accent-digit">0</span>4
      </h1>

      <h2 class="error-title">This page doesn't exist</h2>

      <p class="error-desc">
        The link you followed might be broken, or the page may have been moved.
      </p>

      <div class="error-desc-ar">
        الصفحة التي تبحث عنها غير موجودة أو تم تغيير رابطها.
      </div>

      <div class="error-action-row">
        <a href="https://www.bariabder.com" class="btn-main">
          <span>Go to Main Page</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="error-footer">
    <span>© Bari Abder — The 45 Method</span>
    <div class="footer-links">
      <a href="https://www.bariabder.com">Home</a>
      <span>·</span>
      <a href="https://instagram.com/bariabder" target="_blank" rel="noopener noreferrer">Instagram</a>
      <span>·</span>
      <a href="https://linkedin.com/in/bariabder" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
